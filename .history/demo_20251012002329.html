<!DOCTYPE html>
<html>
<head>
    <title>PhishShield - Live Demo</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container { 
            background: rgba(255,255,255,0.95); 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            color: #333;
            backdrop-filter: blur(10px);
        }
        h1 { 
            text-align: center; 
            margin-bottom: 10px;
            color: #333;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 18px;
        }
        textarea { 
            width: 100%; 
            height: 120px; 
            padding: 20px; 
            border: 2px solid #ddd; 
            border-radius: 12px; 
            font-size: 16px; 
            resize: vertical;
            font-family: inherit;
            transition: all 0.3s;
        }
        textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            outline: none;
        }
        button { 
            width: 100%; 
            padding: 18px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 18px; 
            font-weight: 600;
            cursor: pointer; 
            transition: all 0.3s;
            margin: 20px 0;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:disabled { 
            background: #6c757d; 
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .alert { 
            padding: 25px; 
            border-radius: 12px; 
            margin: 25px 0; 
            border-left: 6px solid;
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .phishing { 
            background: #f8d7da; 
            border-color: #dc3545; 
            color: #721c24; 
        }
        .safe { 
            background: #d4edda; 
            border-color: #28a745; 
            color: #155724; 
        }
        .error { 
            background: #fff3cd; 
            border-color: #ffc107; 
            color: #856404; 
        }
        .loading { 
            background: #d1ecf1; 
            border-color: #17a2b8; 
            color: #0c5460; 
        }
        .feature-badge {
            display: inline-block;
            background: rgba(0,0,0,0.1);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin: 2px;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }
        .stat-item {
            text-align: center;
            padding: 10px;
            background: rgba(0,0,0,0.05);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ PhishShield Live Demo</h1>
        <p class="subtitle">AI-Powered Phishing Detection in Real-Time</p>
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 10px; font-weight: 600; font-size: 16px;">
                Enter URL to analyze:
            </label>
            <textarea id="urlInput" placeholder="https://example.com&#10;Try: https://security-verify-login.com (phishing)&#10;Or: https://google.com (safe)"></textarea>
        </div>
        
        <button onclick="analyzeUrl()" id="analyzeBtn">🔍 Check for Phishing</button>
        
        <div id="result"></div>

        <div style="margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 12px;">
            <h3 style="margin-top: 0;">🎯 Test These URLs:</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button onclick="testUrl('https://google.com')" style="background: #28a745; padding: 10px; font-size: 14px;">✅ Safe: google.com</button>
                <button onclick="testUrl('https://security-verify-login-account.com')" style="background: #dc3545; padding: 10px; font-size: 14px;">🚨 Phishing: security-verify-login.com</button>
                <button onclick="testUrl('https://github.com')" style="background: #28a745; padding: 10px; font-size: 14px;">✅ Safe: github.com</button>
                <button onclick="testUrl('http://paypal-update-account.secure-login.net')" style="background: #dc3545; padding: 10px; font-size: 14px;">🚨 Phishing: paypal-update.net</button>
            </div>
        </div>
    </div>

    <script>
        async function analyzeUrl() {
            const url = document.getElementById('urlInput').value.trim();
            const btn = document.getElementById('analyzeBtn');
            const resultDiv = document.getElementById('result');
            
            if (!url) {
                alert('Please enter a URL to analyze');
                return;
            }
            
            btn.disabled = true;
            btn.textContent = '🔄 Analyzing...';
            resultDiv.innerHTML = '<div class="alert loading"><strong>⏳ Analyzing URL...</strong><br>Checking for phishing patterns...</div>';
            
            try {
                const response = await fetch('http://localhost:8000/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: url })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                let alertClass, icon, title;
                if (data.error) {
                    alertClass = 'error';
                    icon = '❌';
                    title = 'ANALYSIS ERROR';
                } else if (data.is_phishing) {
                    alertClass = 'phishing';
                    icon = data.confidence > 0.7 ? '🚨' : '⚠️';
                    title = data.confidence > 0.7 ? 'HIGH RISK PHISHING' : 'SUSPICIOUS CONTENT';
                } else {
                    alertClass = 'safe';
                    icon = '✅';
                    title = 'LIKELY SAFE';
                }
                
                const confidencePercent = (data.confidence * 100).toFixed(1);
                const featuresHtml = data.features_used && data.features_used.length > 0 
                    ? `<div style="margin-top: 15px;">
                         <strong>Detection Indicators:</strong><br>
                         <div style="margin-top: 8px;">${data.features_used.map(f => `<span class="feature-badge">${f.replace(/_/g, ' ')}</span>`).join('')}</div>
                       </div>`
                    : '';
                
                const statsHtml = !data.error ? `
                    <div class="stats">
                        <div class="stat-item">
                            <strong>Confidence</strong><br>
                            <span style="font-size: 24px; font-weight: bold; color: ${data.is_phishing ? '#dc3545' : '#28a745'}">${confidencePercent}%</span>
                        </div>
                        <div class="stat-item">
                            <strong>Verdict</strong><br>
                            <span style="font-size: 18px; font-weight: bold;">${data.is_phishing ? 'PHISHING' : 'SAFE'}</span>
                        </div>
                    </div>
                ` : '';
                
                resultDiv.innerHTML = `
                    <div class="alert ${alertClass}">
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                            <span style="font-size: 24px;">${icon}</span>
                            <h3 style="margin: 0;">${title}</h3>
                        </div>
                        <p><strong>URL Analyzed:</strong> ${data.message}</p>
                        ${statsHtml}
                        ${featuresHtml}
                        ${data.error ? `<p><strong>Error:</strong> ${data.error}</p>` : ''}
                        <p style="margin-top: 15px; font-size: 12px; opacity: 0.7;">
                            Analyzed at: ${new Date().toLocaleString()}
                        </p>
                    </div>
                `;
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `
                    <div class="alert error">
                        <h3>❌ Connection Error</h3>
                        <p><strong>Could not connect to backend server.</strong></p>
                        <p>Please make sure:</p>
                        <ul>
                            <li>Backend is running on localhost:8000</li>
                            <li>You executed: <code>cd backend && python working_main.py</code></li>
                            <li>No firewall is blocking the connection</li>
                        </ul>
                        <p><strong>Error details:</strong> ${error.message}</p>
                    </div>
                `;
            }
            
            btn.disabled = false;
            btn.textContent = '🔍 Check for Phishing';
        }

        function testUrl(url) {
            document.getElementById('urlInput').value = url;
            analyzeUrl();
        }

        // Allow pressing Enter in textarea
        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                analyzeUrl();
            }
        });
    </script>
</body>
</html>
